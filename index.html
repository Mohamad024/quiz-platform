<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>منصة المسابقات التفاعلية</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/themes.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body class="font-cairo antialiased text-gray-900 dark:text-gray-100 bg-gray-50 dark:bg-gray-900 transition-colors duration-300">
<nav class="sticky top-0 z-50 border-b dark:border-gray-700 bg-white/80 dark:bg-gray-800/80 backdrop-blur">
  <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
    <div class="flex items-center gap-2 font-bold text-xl text-indigo-600 dark:text-indigo-400">كويز بلس</div>
    <div class="hidden md:flex items-center gap-6 text-sm text-gray-600 dark:text-gray-400" id="nav-links"></div>
    <div class="flex items-center gap-3" id="user-area"></div>
    <button id="theme-toggle" class="p-2 rounded hover:bg-gray-100 dark:hover:bg-gray-700" title="الوضع الليلي/النهاري" aria-label="تغيير الوضع">☀️/🌙</button>
    <button id="lang-toggle" class="p-2 rounded hover:bg-gray-100 dark:hover:bg-gray-700" title="تغيير اللغة">AR/EN</button>
  </div>
</nav>
<main class="max-w-7xl mx-auto px-4 py-6 min-h-screen" id="router-outlet"></main>
<footer class="border-t dark:border-gray-700 bg-white/60 dark:bg-gray-800/60 py-4 text-center text-xs text-gray-500 dark:text-gray-400">
  منصة مسابقات تفاعلية - تخزين محلي (LocalStorage) - غير آمن للإنتاج
</footer>
<script type="module" src="js/app.js"></script>
<script>
  // تحذير عند فتح الملف مباشرة بدون خادم
  if (location.protocol === 'file:') {
    const out = document.getElementById('router-outlet');
    if (out) {
      out.innerHTML = `
        <div class="max-w-md mx-auto text-center py-20 bg-amber-50 dark:bg-amber-900/20 border border-amber-200 dark:border-amber-800 rounded-lg p-6">
          <h2 class="text-xl font-bold text-amber-800 dark:text-amber-400 mb-2">⚠️ يرجى استخدام خادم محلي</h2>
          <p class="text-gray-600 dark:text-gray-300 mb-4">لا يمكن تشغيل JavaScript Modules عند فتح الملف مباشرة (file://).</p>
          <div class="space-y-2 text-sm text-left">
            <p class="bg-white dark:bg-gray-800 p-3 rounded border border-gray-200 dark:border-gray-700"><strong>الخيار 1 (أنسب):</strong> شغّل الأمر في مجلد المشروع:<br><code class="block text-indigo-600 dark:text-indigo-400 mt-1">npx serve .</code><br>ثم افتح: <code>http://localhost:3000</code></p>
            <p class="bg-white dark:bg-gray-800 p-3 rounded border border-gray-200 dark:border-gray-700"><strong>الخيار 2:</strong> استخدم بايثون:<br><code class="block text-indigo-600 dark:text-indigo-400 mt-1">python -m http.server 8000</code><br>ثم افتح: <code>http://localhost:8000</code></p>
          </div>
          <p class="text-xs text-gray-500 mt-4">أو ارفع الملفات على GitHub فعّل GitHub Pages.</p>
        </div>
      `;
    }
  }
</script>
</body>
</html>
